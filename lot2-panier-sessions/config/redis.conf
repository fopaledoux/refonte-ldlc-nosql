# =============================================================================
# Lot 2 — Configuration Redis (environnement de développement)
# Chaque réglage correspond à un choix justifié dans docs/conception.md (Lot 2).
# =============================================================================

# --- Réseau -------------------------------------------------------------------
# Développement uniquement : pas de mot de passe, accessible depuis le réseau Docker.
# En production : ACL (un utilisateur par service, commandes limitées) + TLS.
bind 0.0.0.0
protected-mode no
port 6379

# --- Persistance : un panier perdu est une vente perdue -----------------------
# AOF écrit sur disque chaque seconde : au pire 1 seconde de modifications perdue
# en cas de crash. Les instantanés RDB servent aux sauvegardes et aux redémarrages rapides.
appendonly yes
appendfsync everysec
save 900 1
save 300 100
save 60 10000

# --- Mémoire --------------------------------------------------------------------
# Toutes les données vivent en RAM : on fixe un plafond.
# volatile-lru : si le plafond est atteint (pic de trafic), Redis évince d'abord les
# paniers et sessions (clés avec TTL) les moins récemment utilisés, plutôt que de
# refuser les ajouts au panier. Les clés sans TTL (réplique du catalogue) ne sont
# jamais évincées.
maxmemory 256mb
maxmemory-policy volatile-lru

# Les petits hashes (paniers, sessions) sont stockés en "listpack", un format
# compact. Au-delà de 128 lignes ou de 64 octets par valeur : table de hachage.
hash-max-listpack-entries 128
hash-max-listpack-value 64

# --- Expiration -------------------------------------------------------------------
# Publie un événement à chaque expiration de clé (canal __keyevent@0__:expired) :
# un panier qui expire est un panier abandonné, signal utile au Lot 3.
notify-keyspace-events Ex
# Libération mémoire des clés expirées ou supprimées en arrière-plan (pas de blocage).
lazyfree-lazy-expire yes
lazyfree-lazy-user-del yes

# --- Fonctions Lua --------------------------------------------------------------------
# Une fonction qui dépasse 5 s est signalée (les nôtres s'exécutent en microsecondes).
busy-reply-threshold 5000
